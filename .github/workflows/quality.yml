name: MeowOS quality

on:
  push:
  pull_request:

jobs:
  runtime-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test standalone runtime
        run: ./scripts/build-runtime.sh
      - name: Run shell syntax and repository gates
        run: |
          sh -n scripts/test.sh scripts/build-linux.sh scripts/build-runtime.sh scripts/verify-device.sh scripts/audit-experimental-architecture.sh
          ./scripts/test.sh
          ./scripts/audit-experimental-architecture.sh
