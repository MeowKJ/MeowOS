[Journal]
# Keep kernel, systemd and application logs on the SD card so a failed boot can
# be diagnosed offline.  Bound disk usage to avoid exhausting the rootfs.
Storage=persistent
Compress=yes
Seal=yes
SyncIntervalSec=30s
SystemMaxUse=128M
SystemKeepFree=256M
MaxFileSec=1day
MaxRetentionSec=30day
RateLimitIntervalSec=30s
RateLimitBurst=5000

