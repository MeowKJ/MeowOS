# Meow OS internal I2S speaker with a persistent software volume control.
pcm.meow_hardware {
    type hw
    card Speaker
    device 0
}

pcm.meow_volume {
    type softvol
    slave.pcm "meow_hardware"
    control {
        name "Speaker"
        card Speaker
    }
    min_dB -51.0
    max_dB 0.0
    resolution 101
}

pcm.!default {
    type plug
    slave.pcm "meow_volume"
}

ctl.!default {
    type hw
    card Speaker
}
